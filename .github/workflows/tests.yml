# Runs the test suite on every push and pull request.
name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: System packages (PDF page check)
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr
      - name: Python packages
        run: python -m pip install -r requirements.txt pytest-timeout==2.4.0 playwright==1.56.0
      - name: Browser for the screen tests
        run: python -m playwright install --with-deps chromium
      - name: No network code, honest claims, documents cite real tests
        run: python -m pytest -q tests/test_no_network.py tests/test_claims.py tests/test_docs_cite_real_tests.py tests/test_boundary.py
      - name: Everything
        run: ./tools/run_tests.sh all
